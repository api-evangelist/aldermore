aid: aldermore
url: https://raw.githubusercontent.com/api-evangelist/aldermore/refs/heads/main/apis.yml
name: Aldermore Bank
kind: company
description: Aldermore Bank plc is a UK specialist bank founded in 2009 and headquartered
  in Reading, offering savings accounts and specialist lending across residential and
  buy-to-let mortgages, commercial and property finance, asset finance, invoice finance,
  and motor finance (through sister company MotoNovo Finance). Aldermore Group is wholly
  owned by South Africa's FirstRand Group, which acquired it in 2018 and, as of 2026,
  has begun a process to sell the UK business and exit the market. Aldermore Bank plc
  is authorised by the Prudential Regulation Authority and regulated by the Financial
  Conduct Authority and the PRA (Financial Services Register number 204503). It is a
  branchless, digitally-delivered specialist lender rather than a full-service current-account
  bank, and it is NOT one of the nine CMA-mandated banks (CMA9). Because it does not
  provide personal or business current accounts, its UK Open Banking (OBIE / PSD2)
  payment-account footprint is minimal, and no public Aldermore developer portal, Open
  Data endpoint, or bank-proprietary API surface could be confirmed at bootstrap; the
  OBIE Open Data and Read/Write API families below are represented as the shared UK
  Open Banking standard, unverified for this bank.
